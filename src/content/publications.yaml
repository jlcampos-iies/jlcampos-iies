- id: "identificacion-de-magnitudes-en-instalaciones-termicas-maquinas-y-equipos-termicos-i-n-1"
  cover: "../assets/images/publications/imgunidadmagnitudes.jpg"
  amazon:
    print: "B09BGHZ3K6"
    kindle: "B09BDM2K7L"
  companionUrl: "https://met.jlc-ingenieros.com/unidades/ud01-magnitudes/"
  title:
    es: "Identificación de Magnitudes en Instalaciones Térmicas (Máquinas y Equipos Térmicos I nº 1)"
    en: "Identificación de Magnitudes en Instalaciones Térmicas (Máquinas y Equipos Térmicos I nº 1)"
    ca: "Identificación de Magnitudes en Instalaciones Térmicas (Máquinas y Equipos Térmicos I nº 1)"
  summary:
    es: "El técnico debe conocer las magnitudes que intervienen en los procesos termodinámicos, ya que le permiten analizar el rendimiento y detectar posibles averías en las instalaciones térmicas. Una de las más importantes es la entalpía, fundamental para caracterizar las máquinas térmicas, especialmente las del ciclo frigorífico. Comprender conceptos como la energía o la entalpía puede resultar complejo incluso para profesionales experimentados. Además, muchos equipos actuales son de fabricación extranjera, por lo que es esencial dominar los factores de conversión de unidades. Este conocimiento garantiza precisión y eficacia en el trabajo técnico."
    en: "Technicians need to understand the quantities involved in thermodynamic processes, as they allow them to analyse performance and detect possible faults in thermal installations. One of the most important is enthalpy, which is essential to characterise thermal machines, especially those based on the refrigeration cycle. Understanding concepts such as energy or enthalpy can be difficult even for experienced professionals. Moreover, much of today's equipment is manufactured abroad, so a good command of unit conversion factors is essential. This knowledge ensures accuracy and effectiveness in technical work."
    ca: "El tècnic ha de conèixer les magnituds que intervenen en els processos termodinàmics, ja que li permeten analitzar el rendiment i detectar possibles avaries en les instal·lacions tèrmiques. Una de les més importants és l'entalpia, fonamental per caracteritzar les màquines tèrmiques, especialment les del cicle frigorífic. Comprendre conceptes com l'energia o l'entalpia pot resultar complex fins i tot per a professionals experimentats. A més, molts equips actuals són de fabricació estrangera, per la qual cosa és essencial dominar els factors de conversió d'unitats. Aquest coneixement garanteix precisió i eficàcia en el treball tècnic."
- id: "higrometria-maquinas-y-equipos-termicos-i-n-2"
  cover: "../assets/images/publications/imghigrometria.png"
  amazon:
    print: "B09BMBF4CL"
    kindle: "B09BFLFJ6V"
  companionUrl: "https://met.jlc-ingenieros.com/unidades/ud02-higrometria/"
  title:
    es: "Higrometría (Máquinas y Equipos Térmicos I nº 2)"
    en: "Higrometría (Máquinas y Equipos Térmicos I nº 2)"
    ca: "Higrometría (Máquinas y Equipos Térmicos I nº 2)"
  summary:
    es: "Las instalaciones térmicas buscan crear condiciones adecuadas en un ambiente, lo que exige tratar correctamente el aire atmosférico que lo compone. Para ello, es esencial conocer su composición y comportamiento, especialmente su contenido de humedad, estudiado por la higrometría. Un diseño moderno debe considerar no solo la temperatura, sino también factores como el ruido, la difusión y la calidad del aire. El punto de partida de toda instalación es un análisis preciso de las condiciones higrométricas del entorno. En última instancia, la climatización tiene como objetivo principal garantizar el confort y bienestar de las personas."
    en: "Thermal installations aim to create suitable conditions in an indoor environment, which requires proper treatment of the atmospheric air it contains. To do so, it is essential to understand the composition and behaviour of air, particularly its moisture content, which is the subject of hygrometry. A modern design must take into account not only temperature but also factors such as noise, air diffusion and air quality. The starting point for any installation is an accurate analysis of the hygrometric conditions of the environment. Ultimately, the main purpose of air conditioning is to ensure people's comfort and well-being."
    ca: "Les instal·lacions tèrmiques tenen per objectiu crear unes condicions adequades en un ambient, cosa que exigeix tractar correctament l'aire atmosfèric que el compon. Per fer-ho, és essencial conèixer-ne la composició i el comportament, especialment el contingut d'humitat, que és l'objecte d'estudi de la higrometria. Un disseny modern ha de tenir en compte no només la temperatura, sinó també factors com el soroll, la difusió i la qualitat de l'aire. El punt de partida de tota instal·lació és una anàlisi precisa de les condicions higromètriques de l'entorn. En darrer terme, la climatització té com a objectiu principal garantir el confort i el benestar de les persones."
- id: "calculo-de-cargas-termicas-maquinas-y-equipos-termicos-i-n-3"
  cover: "../assets/images/publications/imgunidad3cargastermicas.jpg"
  amazon:
    print: "B09BM38K12"
    kindle: "B09BFRPY6K"
  companionUrl: "https://met.jlc-ingenieros.com/unidades/ud03-cargas-termicas/"
  title:
    es: "Cálculo de Cargas Térmicas (Máquinas y Equipos Térmicos I nº 3)"
    en: "Cálculo de Cargas Térmicas (Máquinas y Equipos Térmicos I nº 3)"
    ca: "Cálculo de Cargas Térmicas (Máquinas y Equipos Térmicos I nº 3)"
  summary:
    es: "Toda operación de acondicionamiento implica una transferencia de calor que puede analizarse mediante un balance energético. Para ello, es necesario conocer con precisión la carga térmica, es decir, la energía requerida para realizar dicho proceso. Este cálculo es el punto de partida fundamental para cualquier instalador, ya que un error puede tener consecuencias graves. En casos complejos, como en climatización de espacios singulares, es recomendable contar con el apoyo de un ingeniero especializado. Obtener un dato correcto es esencial para diseñar instalaciones térmicas eficientes y seguras."
    en: "Every air-conditioning process involves a heat transfer that can be analysed by means of an energy balance. This requires precise knowledge of the thermal load, that is, the energy needed to carry out the process. This calculation is the essential starting point for any installer, since an error can have serious consequences. In complex cases, such as the air conditioning of unusual spaces, the support of a specialised engineer is advisable. Obtaining the correct figure is essential to design efficient and safe thermal installations."
    ca: "Tota operació de condicionament implica una transferència de calor que es pot analitzar mitjançant un balanç energètic. Per fer-ho, cal conèixer amb precisió la càrrega tèrmica, és a dir, l'energia necessària per dur a terme el procés. Aquest càlcul és el punt de partida fonamental per a qualsevol instal·lador, ja que un error pot tenir conseqüències greus. En casos complexos, com la climatització d'espais singulars, és recomanable comptar amb el suport d'un enginyer especialitzat. Obtenir una dada correcta és essencial per dissenyar instal·lacions tèrmiques eficients i segures."
- id: "generacion-de-calor-maquinas-y-equipos-termicos-i-n-4"
  cover: "../assets/images/publications/imgunidadivgeneracion.jpg"
  amazon:
    print: "B09BG77471"
    kindle: "B09BG68YTJ"
  companionUrl: "https://met.jlc-ingenieros.com/unidades/ud04-generacion-calor/"
  title:
    es: "Generación de Calor (Máquinas y Equipos Térmicos I nº 4)"
    en: "Generación de Calor (Máquinas y Equipos Térmicos I nº 4)"
    ca: "Generación de Calor (Máquinas y Equipos Térmicos I nº 4)"
  summary:
    es: "En las últimas décadas, la demanda energética mundial ha aumentado, provocando varias crisis económico-energéticas que afectaron gravemente a la economía global. En España, esta situación es más preocupante por su alta dependencia del exterior, lo que impulsó la Estrategia de Ahorro y Eficiencia Energética 2004-2012. El uso de combustibles fósiles sigue siendo una de las principales causas del deterioro ambiental. Ante la falta de alternativas tecnológicas plenamente competitivas, resulta esencial mejorar la eficiencia de las máquinas térmicas. Esta unidad aborda tanto la generación de calor mediante combustibles fósiles como el uso de la energía solar, promoviendo la optimización de su rendimiento."
    en: "In recent decades, global energy demand has grown, triggering several economic and energy crises that seriously affected the world economy. In Spain the situation is more worrying because of the country's high dependence on energy imports, which led to the Energy Saving and Efficiency Strategy 2004-2012. The use of fossil fuels remains one of the main causes of environmental degradation. In the absence of fully competitive technological alternatives, improving the efficiency of thermal machines is essential. This unit covers both heat generation from fossil fuels and the use of solar energy, with a focus on optimising their performance."
    ca: "En les darreres dècades, la demanda energètica mundial ha augmentat i ha provocat diverses crisis economicoenergètiques que van afectar greument l'economia global. A Espanya, aquesta situació és més preocupant per l'alta dependència de l'exterior, cosa que va impulsar l'Estratègia d'Estalvi i Eficiència Energètica 2004-2012. L'ús de combustibles fòssils continua sent una de les principals causes del deteriorament ambiental. Davant la manca d'alternatives tecnològiques plenament competitives, és essencial millorar l'eficiència de les màquines tèrmiques. Aquesta unitat tracta tant la generació de calor mitjançant combustibles fòssils com l'ús de l'energia solar, amb l'objectiu d'optimitzar-ne el rendiment."
- id: "elaboracion-del-ciclo-frigorifico-maquinas-y-equipos-termicos-i-n-5"
  cover: "../assets/images/publications/imgunidadvelaboracion.jpg"
  amazon:
    print: "B09BGPG2Q1"
    kindle: "B09BG35C8H"
  companionUrl: "https://met.jlc-ingenieros.com/unidades/ud05-ciclo-frigorifico/"
  title:
    es: "Elaboración del Ciclo Frigorífico (Máquinas y Equipos Térmicos I nº 5)"
    en: "Elaboración del Ciclo Frigorífico (Máquinas y Equipos Térmicos I nº 5)"
    ca: "Elaboración del Ciclo Frigorífico (Máquinas y Equipos Térmicos I nº 5)"
  summary:
    es: "El ciclo cerrado de compresión de vapor, representado en el diagrama de Mollier, es una herramienta fundamental para los técnicos en sistemas térmicos. Permite analizar el funcionamiento y la eficiencia energética de las máquinas que lo utilizan. Este diagrama muestra numerosos parámetros operativos y energéticos. Además, ayuda a prever cómo se comportará la máquina ante posibles cambios en dichos parámetros. En conjunto, es esencial para evaluar y optimizar el rendimiento de los sistemas frigoríficos."
    en: "The closed vapour-compression cycle, represented on the Mollier diagram, is a fundamental tool for thermal systems technicians. It makes it possible to analyse the operation and energy efficiency of the machines that use it. The diagram shows numerous operating and energy parameters. It also helps to predict how the machine will behave in response to possible changes in those parameters. Taken together, it is essential for evaluating and optimising the performance of refrigeration systems."
    ca: "El cicle tancat de compressió de vapor, representat en el diagrama de Mollier, és una eina fonamental per als tècnics en sistemes tèrmics. Permet analitzar el funcionament i l'eficiència energètica de les màquines que l'utilitzen. Aquest diagrama mostra nombrosos paràmetres operatius i energètics. A més, ajuda a preveure com es comportarà la màquina davant possibles canvis en aquests paràmetres. En conjunt, és essencial per avaluar i optimitzar el rendiment dels sistemes frigorífics."
- id: "seleccion-de-fluidos-refrigerantes-y-lubricantes-maquinas-y-equipos-termicos-ii-n-1"
  cover: "../assets/images/publications/imgunidadvi.jpg"
  amazon:
    print: "B09BJQGG16"
    kindle: "B09BNZTMBW"
  companionUrl: "https://met.jlc-ingenieros.com/unidades/ud06-refrigerantes-lubricantes/"
  title:
    es: "Selección de Fluidos Refrigerantes y Lubricantes (Máquinas y Equipos Térmicos II nº 1)"
    en: "Selección de Fluidos Refrigerantes y Lubricantes (Máquinas y Equipos Térmicos II nº 1)"
    ca: "Selección de Fluidos Refrigerantes y Lubricantes (Máquinas y Equipos Térmicos II nº 1)"
  summary:
    es: "Los refrigerantes son agentes fundamentales en los sistemas térmicos, ya que permiten la transferencia de calor. Su desarrollo técnico está estrechamente vinculado a la evolución de la refrigeración, especialmente desde los años 70, cuando se descubrió su impacto ambiental. Algunos refrigerantes con cloro o bromo contribuyen al calentamiento global y a la destrucción de la capa de ozono, lo que llevó a su regulación mediante los protocolos de Montreal y Kioto. Además, la compatibilidad entre el refrigerante y los aceites lubricantes es esencial para garantizar el buen funcionamiento y la eficiencia del sistema. Finalmente, la Ley 31/1995 de Prevención de Riesgos Laborales establece las medidas necesarias para proteger la salud de los trabajadores también en el ámbito de las instalaciones térmicas."
    en: "Refrigerants are key agents in thermal systems, as they enable heat transfer. Their technical development is closely linked to the evolution of refrigeration, especially since the 1970s, when their environmental impact was discovered. Some refrigerants containing chlorine or bromine contribute to global warming and to the depletion of the ozone layer, which led to their regulation under the Montreal and Kyoto protocols. In addition, compatibility between the refrigerant and the lubricating oils is essential to ensure the proper operation and efficiency of the system. Finally, Spanish Law 31/1995 on the Prevention of Occupational Risks sets out the measures needed to protect workers' health, including in the field of thermal installations."
    ca: "Els refrigerants són agents fonamentals en els sistemes tèrmics, ja que permeten la transferència de calor. El seu desenvolupament tècnic està estretament vinculat a l'evolució de la refrigeració, especialment des dels anys setanta, quan se'n va descobrir l'impacte ambiental. Alguns refrigerants amb clor o brom contribueixen a l'escalfament global i a la destrucció de la capa d'ozó, cosa que en va motivar la regulació mitjançant els protocols de Mont-real i Kyoto. A més, la compatibilitat entre el refrigerant i els olis lubricants és essencial per garantir el bon funcionament i l'eficiència del sistema. Finalment, la Llei 31/1995, de prevenció de riscos laborals, estableix les mesures necessàries per protegir la salut dels treballadors també en l'àmbit de les instal·lacions tèrmiques."
