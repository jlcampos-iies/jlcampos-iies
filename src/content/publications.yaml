- id: "calculo-de-cargas-termicas-maquinas-y-equipos-termicos-i-n-3"
  cover: "../assets/images/publications/imgunidad3cargastermicas.jpg"
  amazonUrl: "https://www.amazon.es/C%C3%A1lculo-T%C3%A9rmicas-M%C3%A1quinas-Equipos-T%C3%A9rmicos-ebook/dp/B09BFRPY6K"
  title:
    es: "Cálculo de Cargas Térmicas (Máquinas y Equipos Térmicos I nº 3)"
    en: "Cálculo de Cargas Térmicas (Máquinas y Equipos Térmicos I nº 3)"
    ca: "Cálculo de Cargas Térmicas (Máquinas y Equipos Térmicos I nº 3)"
  summary:
    es: "Toda operación de acondicionamiento implica una transferencia de calor que puede analizarse mediante un balance energético. Para ello, es necesario conocer con precisión la carga térmica, es decir, la energía requerida para realizar dicho proceso. Este cálculo es el punto de partida fundamental para cualquier instalador, ya que un error puede tener consecuencias graves. En casos complejos, como en climatización de espacios singulares, es recomendable contar con el apoyo de un ingeniero especializado. Obtener un dato correcto es esencial para diseñar instalaciones térmicas eficientes y seguras."
