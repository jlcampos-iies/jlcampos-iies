name: CI

# En main no se dispara por push: ese push lo ejecuta deploy.yml, que reutiliza este
# workflow (workflow_call) como paso previo al despliegue, para no correr la CI dos veces.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # shellcheck viene instalado en ubuntu-latest.
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/dns/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: cfn-lint
        run: |
          pip install cfn-lint aws-sam-translator
          # La plantilla final lleva dentro la CloudFront Function generada por el build (npm test).
          node infra/render.mjs
          cfn-lint infra/build/template.yaml --regions eu-west-3
          cfn-lint infra/cert.yaml --regions us-east-1
