name: CI

# En main no se dispara por push: ese push lo ejecuta deploy.yml, que reutiliza este
# workflow (workflow_call) como paso previo al despliegue, para no correr la CI dos veces.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
